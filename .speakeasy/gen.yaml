configVersion: 2.0.0
generation:
  sdkClassName: Shadeform
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: true
    sharedNestedComponentsJan2026: true
    nameOverrideFeb2026: true
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: true
    hoistGlobalSecurity: true
  inferSSEOverload: true
  sdkHooksConfigAccess: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: body
  versioningStrategy: automatic
  persistentEdits:
    enabled: "true"
  tests:
    generateTests: false
    generateNewTests: true
    skipResponseBodyAssertions: false
cli:
  version: 0.1.5
  additionalDependencies: {}
  agentEnvironmentDetection: true
  arrayFlagFormat: repeatable
  classifiedErrors: false
  cliName: shade
  defaultColor: auto
  defaultTimeout: ""
  distribution:
    homebrew:
      enabled: false
      tap: ""
    nfpm:
      enabled: false
      formats: deb,rpm
      license: ""
      maintainer: ""
    winget:
      enabled: false
      license: ""
      packageIdentifier: ""
      publisher: ""
      publisherUrl: ""
      repositoryOwner: ""
  enableCustomCodeRegions: false
  envVarPrefix: SHADEFORM
  fixFlags:
    encodePathParams: true
  generateRelease: true
  helpStyle: auto
  idiomaticMethodCollisionNames: true
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/apierrors
      operations: models/operations
      shared: models/components
      webhooks: models/webhooks
  interactiveAuth: true
  interactiveByDefault: true
  interactiveMode: true
  interactiveTheme:
    accentColor: '#38BDF8'
    dimmedColor: '#64748B'
    errorColor: '#F87171'
    subtleColor: '#475569'
    successColor: '#4ADE80'
  jqRawOutput: false
  packageName: github.com/shadeform/shadeform-cli
  removeStutter: true
  retryFlagsVisibility: visible
  retryMethodPolicy: spec
  rootVersionFlag: true
  serverSelectionFlag: visible
