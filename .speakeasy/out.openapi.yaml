openapi: 3.0.0
servers:
  - description: Shadeform Production
    url: https://api.shadeform.ai/v1
info:
  description: 'Shadeform is a single API and platform for deploying and managing cloud GPUs.'
  version: 1.0.0
  title: Shadeform API
  contact:
    name: Shadeform
    email: support@shadeform.ai
    url: https://www.shadeform.ai
security:
  - ApiKeyAuth: []
paths:
  /instances:
    get:
      summary: List instances
      operationId: Instances
      description: 'Get all non deleted instances. Note: instances in the "deleting" status will also show up here.'
      responses:
        '200':
          description: 'Returns an InstancesResponse object.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancesResponse'
      tags:
        - instances
      x-speakeasy-name-override: list
      x-speakeasy-mcp:
        scopes:
          - read
  /instances/types:
    get:
      parameters:
        - in: query
          name: cloud
          schema:
            type: string
          example: aws
          description: "Filter the instance type results by cloud."
        - in: query
          name: region
          schema:
            type: string
          example: us-east-1a
          description: "Filter the instance type results by region."
        - in: query
          name: num_gpus
          schema:
            type: string
          example: 1
          description: "Filter the instance type results by the number of gpus."
        - in: query
          name: gpu_type
          schema:
            type: string
          example: A100_80G
          description: "Filter the instance type results by gpu type."
        - in: query
          name: shade_instance_type
          schema:
            type: string
          example: A100_80G
          description: "Filter the instance type results by the shade instance type."
        - in: query
          name: available
          schema:
            type: boolean
          example: true
          description: "Filter the instance type results by availability. Applies to individual availability entries, so an instance type whose region is available only as spot is still returned with just its spot entry; filter by `rental_type` client-side if you only want on-demand."
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - price
          example: price
          description: "Sort the order of the instance type results."
      summary: List available instance types
      operationId: InstancesTypes
      description: "Return all the GPU instance types with their corresponding availability and specs.\n\nEvery `availability` entry carries a `rental_type` (`on_demand` or `spot`). Instance types that offer spot list each region twice, once per rental type, and the two entries can differ in `available`. If your integration keys on `region` or checks whether any region is available, filter to `rental_type: on_demand` first to keep the previous behavior. See the [Spot Instances guide](/guides/spotinstances) for details."
      responses:
        '200':
          description: Returns an InstanceTypesResponse object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypesResponse'
      tags:
        - instances
      x-speakeasy-name-override: listTypes
      x-speakeasy-mcp:
        scopes:
          - read
  /instances/create:
    post:
      summary: Create an instance
      operationId: InstancesCreate
      description: 'Create a new GPU instance. Our create API is designed to be asynchronous, so the response will be a CreateResponse object with a status of "creating". We then have a process that will pick it up and create it. You can poll the /instances/{id}/info endpoint to check the status of the instance.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: Returns a CreateResponse object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
      tags:
        - instances
      x-speakeasy-name-override: create
      x-speakeasy-mcp:
        scopes:
          - write
  '/instances/{id}/info':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The instance id'
    get:
      summary: Get an instance
      operationId: InstancesInfo
      description: "Get details for the specified, non deleted, instance in the url."
      responses:
        '200':
          description: "Return an instance object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfoResponse'
      tags:
        - instances
      x-speakeasy-name-override: get
      x-speakeasy-mcp:
        scopes:
          - read
  '/instances/{id}/update':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The instance id'
    post:
      summary: Update an instance
      operationId: InstancesUpdate
      description: "Update mutable details about the instance. Set a value to null to delete it. Omit a value or leave undefined to keep unchanged."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: 'Confirms the update of an instance.'
      tags:
        - instances
      x-speakeasy-name-override: update
      x-speakeasy-mcp:
        scopes:
          - write
  '/instances/{id}/delete':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: The instance id
    post:
      summary: Delete an instance
      operationId: InstancesDelete
      description: "This will move the instance to the 'deleting' status while the instance is being deleted. Once the instance has entered the 'deleting' status, the account will no longer be billed for the instance."
      responses:
        '200':
          description: 'Confirms the deletion of an instance.'
      tags:
        - instances
      x-speakeasy-name-override: delete
      x-speakeasy-mcp:
        scopes:
          - write
  '/instances/{id}/restart':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: The instance id
    post:
      summary: Restart an instance
      operationId: InstancesRestart
      description: "Restart an instance. The status of the instance will stay as 'active' throughout, but you may have to wait a few minutes for the instance to be ready to use again."
      responses:
        '200':
          description: 'Confirms the restart of an instance has been initiated. This does not confirm that the instance restarted successfully.'
      tags:
        - instances
      x-speakeasy-name-override: restart
      x-speakeasy-mcp:
        scopes:
          - write
  /clusters:
    get:
      summary: List clusters
      operationId: Clusters
      description: 'Get all non deleted clusters.'
      responses:
        '200':
          description: 'Returns a ClustersResponse object.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClustersResponse'
      tags:
        - clusters
      x-speakeasy-name-override: list
      x-speakeasy-mcp:
        scopes:
          - read
  /clusters/types:
    get:
      summary: List available cluster types
      operationId: ClustersTypes
      description: 'Return all the GPU cluster types with their corresponding availability and specs.'
      responses:
        '200':
          description: Returns a ClusterTypesResponse object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTypesResponse'
      tags:
        - clusters
      x-speakeasy-name-override: listTypes
      x-speakeasy-mcp:
        scopes:
          - read
  /clusters/create:
    post:
      summary: Create a cluster
      operationId: ClustersCreate
      description: 'Create a new GPU cluster.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterRequest'
        required: true
      responses:
        '200':
          description: Returns a CreateClusterResponse object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClusterResponse'
      tags:
        - clusters
      x-speakeasy-name-override: create
      x-speakeasy-mcp:
        scopes:
          - write
  '/clusters/{id}/info':
    parameters:
      - in: path
        name: id
        required: true
        example: '8eda86fe-0f36-41ed-9837-0ccf8f6e0fcb'
        schema:
          type: string
          minimum: 1
        description: 'The cluster id'
    get:
      summary: Get a cluster
      operationId: ClustersInfo
      description: "Get details for the specified, non deleted, cluster in the url."
      responses:
        '200':
          description: "Return a cluster object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterInfoResponse'
      tags:
        - clusters
      x-speakeasy-name-override: get
      x-speakeasy-mcp:
        scopes:
          - read
  '/clusters/{id}/delete':
    parameters:
      - in: path
        name: id
        required: true
        example: 'b1450ae8-2fa3-4ceb-a4f3-b834805418fc'
        schema:
          type: string
          minimum: 1
        description: The cluster id
    post:
      summary: Delete a cluster
      operationId: ClustersDelete
      description: "This will move the cluster to the 'deleting' status while the cluster is being deleted. Once the cluster has entered the 'deleting' status, the account will no longer be billed for the cluster."
      responses:
        '200':
          description: 'Confirms the deletion of a cluster.'
      tags:
        - clusters
      x-speakeasy-name-override: delete
      x-speakeasy-mcp:
        scopes:
          - write
  '/sshkeys':
    get:
      summary: List SSH keys
      operationId: SshKeys
      description: 'Get all SSH Keys for the account.'
      responses:
        '200':
          description: 'Returns an SSHKeysResponse object'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKeysResponse'
      tags:
        - ssh-keys
      x-speakeasy-name-override: list
      x-speakeasy-mcp:
        scopes:
          - read
  '/sshkeys/add':
    post:
      summary: Add an SSH key
      operationId: SshKeysAdd
      description: 'Add a new SSH Key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSshKeyRequest'
        required: true
      responses:
        '200':
          description: 'Returns a AddSshKeyResponse object'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddSshKeyResponse'
      tags:
        - ssh-keys
      x-speakeasy-name-override: add
      x-speakeasy-mcp:
        scopes:
          - write
  '/sshkeys/{id}/delete':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The ssh key id'
    post:
      summary: Delete an SSH key
      operationId: SshKeysDelete
      description: 'Delete an ssh key. The Shadeform managed SSH Key, current default ssh key, and in use SSH Keys cannot be deleted.'
      responses:
        '200':
          description: 'Confirms the deletion of an ssh key.'
      tags:
        - ssh-keys
      x-speakeasy-name-override: delete
      x-speakeasy-mcp:
        scopes:
          - write
  '/sshkeys/{id}/info':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The ssh key id'
    get:
      summary: Get an SSH key
      operationId: SshKeysInfo
      description: "Get details for the specified SSH Key in the url."
      responses:
        '200':
          description: "Return an SshKey object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
      tags:
        - ssh-keys
      x-speakeasy-name-override: get
      x-speakeasy-mcp:
        scopes:
          - read
  '/sshkeys/{id}/setdefault':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The ssh key id'
    post:
      summary: Set the default SSH key
      operationId: SshKeysSetDefault
      description: 'Set the specified SSH Key as the default SSH Key used by Shadeform.'
      responses:
        '200':
          description: 'Confirms that the specified SSH Key was as set as the default key.'
      tags:
        - ssh-keys
      x-speakeasy-name-override: setDefault
      x-speakeasy-mcp:
        scopes:
          - write
  '/volumes':
    get:
      summary: List volumes
      operationId: Volumes
      description: 'Get all storage volumes for the account.'
      responses:
        '200':
          description: 'Returns an VolumesResponse object'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesResponse'
      tags:
        - volumes
      x-speakeasy-name-override: list
      x-speakeasy-mcp:
        scopes:
          - read
  '/volumes/create':
    post:
      summary: Create a volume
      operationId: VolumesCreate
      description: 'Create a new storage volume'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
        required: true
      responses:
        '200':
          description: 'Returns a CreateVolumeResponse object'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVolumeResponse'
      tags:
        - volumes
      x-speakeasy-name-override: create
      x-speakeasy-mcp:
        scopes:
          - write
  '/volumes/{id}/delete':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The volume id.'
    post:
      summary: Delete a volume
      operationId: VolumesDelete
      description: 'Delete a storage volume.'
      responses:
        '200':
          description: 'Confirms the deletion of the specified storage volume.'
      tags:
        - volumes
      x-speakeasy-name-override: delete
      x-speakeasy-mcp:
        scopes:
          - write
  '/volumes/{id}/info':
    parameters:
      - in: path
        name: id
        required: true
        example: 'd290f1ee-6c54-4b01-90e6-d701748f0851'
        schema:
          type: string
          minimum: 1
        description: 'The volume id.'
    get:
      summary: Get a volume
      operationId: VolumesInfo
      description: "Get details for the specified storage volume."
      responses:
        '200':
          description: "Return a volume object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
      tags:
        - volumes
      x-speakeasy-name-override: get
      x-speakeasy-mcp:
        scopes:
          - read
  '/volumes/types':
    get:
      summary: List available volume types
      operationId: VolumesTypes
      description: 'Get list of supported storage volumes.'
      responses:
        '200':
          description: 'Returns an VolumesTypesResponse object.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesTypesResponse'
      tags:
        - volumes
      x-speakeasy-name-override: listTypes
      x-speakeasy-mcp:
        scopes:
          - read
  '/templates':
    get:
      summary: List templates
      operationId: Templates
      description: 'List all templates created by the user'
      responses:
        '200':
          description: 'Returns a list of templates'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesResponse'
      tags:
        - templates
      x-speakeasy-name-override: list
      x-speakeasy-mcp:
        scopes:
          - read
  '/templates/featured':
    get:
      summary: List featured templates
      operationId: TemplatesFeatured
      description: 'List featured templates'
      responses:
        '200':
          description: 'Returns a list of featured templates'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesResponse'
      tags:
        - templates
      x-speakeasy-name-override: listFeatured
      x-speakeasy-mcp:
        scopes:
          - read
  '/templates/{template_id}/info':
    parameters:
      - in: path
        name: template_id
        required: true
        schema:
          type: string
        description: 'The template ID'
    get:
      summary: Get a template
      operationId: TemplatesInfo
      description: 'Get information about a specific template'
      responses:
        '200':
          description: 'Returns template information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
      tags:
        - templates
      x-speakeasy-name-override: get
      x-speakeasy-mcp:
        scopes:
          - read
  '/templates/save':
    post:
      summary: Save a template
      operationId: TemplatesSave
      description: 'Create a new template'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateSaveRequest'
      responses:
        '200':
          description: Returns a TemplateCreateResponse object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateResponse'
      tags:
        - templates
      x-speakeasy-name-override: save
      x-speakeasy-mcp:
        scopes:
          - write
  '/templates/{template_id}/update':
    parameters:
      - in: path
        name: template_id
        required: true
        schema:
          type: string
        description: 'The template ID'
    post:
      summary: Update a template
      operationId: TemplatesUpdate
      description: 'Update an existing template'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateSaveRequest'
      responses:
        '200':
          description: 'Template updated successfully'
      tags:
        - templates
      x-speakeasy-name-override: update
      x-speakeasy-mcp:
        scopes:
          - write
  '/templates/{template_id}/delete':
    parameters:
      - in: path
        name: template_id
        required: true
        schema:
          type: string
        description: 'The template ID'
    post:
      summary: Delete a template
      operationId: TemplatesDelete
      description: 'Delete a template'
      responses:
        '200':
          description: 'Template deleted successfully'
      tags:
        - templates
      x-speakeasy-name-override: delete
      x-speakeasy-mcp:
        scopes:
          - write
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      x-speakeasy-name-override: apiKey
  schemas:
    InstanceTypesResponse:
      description: 'Response of /instances/types'
      type: object
      required:
        - instance_types
      properties:
        instance_types:
          type: array
          items:
            $ref: '#/components/schemas/InstanceType'
    InstanceType:
      description: "Information about a specific instance type"
      type: object
      required:
        - cloud
        - shade_instance_type
        - cloud_instance_type
        - configuration
        - hourly_price
        - deployment_type
        - availability
      properties:
        cloud:
          $ref: '#/components/schemas/Cloud'
        shade_instance_type:
          $ref: '#/components/schemas/ShadeInstanceType'
        cloud_instance_type:
          $ref: '#/components/schemas/CloudInstanceType'
        configuration:
          $ref: '#/components/schemas/InstanceTypeConfiguration'
        hourly_price:
          $ref: '#/components/schemas/HourlyPrice'
        deployment_type:
          $ref: '#/components/schemas/DeploymentType'
        availability:
          type: array
          items:
            $ref: '#/components/schemas/Availability'
          example:
            - region: us-central-1
              available: true
              display_name: US, Wichita, KS
              rental_type: on_demand
            - region: us-central-2
              available: false
              display_name: US, Wichita, KS
              rental_type: on_demand
            - region: us-central-1
              available: true
              display_name: US, Wichita, KS
              rental_type: spot
              hourly_price: "1.50"
        boot_time:
          $ref: '#/components/schemas/BootTime'
    InstancesResponse:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
    Instance:
      type: object
      required:
        - id
        - cloud
        - region
        - shade_instance_type
        - cloud_instance_type
        - cloud_assigned_id
        - shade_cloud
        - name
        - configuration
        - ip
        - ssh_user
        - ssh_port
        - status
        - cost_estimate
        - created_at
        - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        cloud:
          $ref: '#/components/schemas/Cloud'
        region:
          $ref: '#/components/schemas/Region'
        shade_instance_type:
          $ref: '#/components/schemas/ShadeInstanceType'
        cloud_instance_type:
          $ref: '#/components/schemas/CloudInstanceType'
        cloud_assigned_id:
          $ref: '#/components/schemas/CloudAssignedId'
        shade_cloud:
          $ref: '#/components/schemas/ShadeCloud'
        name:
          $ref: '#/components/schemas/Name'
        configuration:
          allOf:
            - $ref: '#/components/schemas/InstanceConfiguration'
            - type: object
              required:
                - os
              properties:
                os:
                  type: string
                  example: ubuntu_22_shade_os
                  description: "The operating system of the instance."
        ip:
          $ref: '#/components/schemas/Ip'
        ssh_user:
          $ref: '#/components/schemas/SshUser'
        ssh_port:
          $ref: '#/components/schemas/SshPort'
        status:
          $ref: '#/components/schemas/Status'
        status_details:
          $ref: '#/components/schemas/StatusDetails'
        cost_estimate:
          $ref: '#/components/schemas/CostEstimate'
        hourly_price:
          $ref: '#/components/schemas/HourlyPrice'
        rental_terms:
          $ref: '#/components/schemas/RentalTerms'
        launch_configuration:
          $ref: '#/components/schemas/LaunchConfiguration'
        tags:
          type: array
          description: 'Add custom, searchable tags to instances.'
          items:
            $ref: '#/components/schemas/Tag'
        port_mappings:
          type: array
          description: 'List of port mappings on an instance that a Cloud Provider might have automatically set up.'
          items:
            $ref: '#/components/schemas/InstancePortMappings'
        active_at:
          $ref: '#/components/schemas/ActiveAt'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        deleted_at:
          $ref: '#/components/schemas/DeletedAt'
        boot_time:
          $ref: '#/components/schemas/BootTime'
    InstanceInfoResponse:
      type: object
      required:
        - id
        - cloud
        - region
        - shade_instance_type
        - cloud_instance_type
        - cloud_assigned_id
        - shade_cloud
        - name
        - configuration
        - ip
        - ssh_user
        - ssh_port
        - status
        - cost_estimate
        - created_at
        - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        cloud:
          $ref: '#/components/schemas/Cloud'
        region:
          $ref: '#/components/schemas/Region'
        shade_instance_type:
          $ref: '#/components/schemas/ShadeInstanceType'
        cloud_instance_type:
          $ref: '#/components/schemas/CloudInstanceType'
        cloud_assigned_id:
          $ref: '#/components/schemas/CloudAssignedId'
        shade_cloud:
          $ref: '#/components/schemas/ShadeCloud'
        name:
          $ref: '#/components/schemas/Name'
        configuration:
          allOf:
            - $ref: '#/components/schemas/InstanceConfiguration'
            - type: object
              required:
                - os
              properties:
                os:
                  type: string
                  example: ubuntu_22_shade_os
                  description: "The operating system of the instance."
        ip:
          $ref: '#/components/schemas/Ip'
        ssh_user:
          $ref: '#/components/schemas/SshUser'
        ssh_port:
          $ref: '#/components/schemas/SshPort'
        status:
          $ref: '#/components/schemas/Status'
        status_details:
          $ref: '#/components/schemas/StatusDetails'
        cost_estimate:
          $ref: '#/components/schemas/CostEstimate'
        hourly_price:
          $ref: '#/components/schemas/HourlyPrice'
        rental_terms:
          $ref: '#/components/schemas/RentalTerms'
        volume_ids:
          type: array
