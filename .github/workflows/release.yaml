name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag is the released version: GoReleaser stamps it into the binary.
      # It may run ahead of the generated version in internal/cli/version.go,
      # which only moves on a Speakeasy regeneration, but it must never fall
      # behind it. A prerelease suffix (v1.0.0-rc.1) is left out of the
      # comparison.
      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_core="${tag_version%%-*}"
          cli_version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/version.go)
          version_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$tag_core" =~ $version_re ]]; then
            printf '::error::Release tag %s is not a vX.Y.Z version.\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          if ! [[ "$cli_version" =~ $version_re ]]; then
            printf '::error::Could not read the generated CLI version from internal/cli/version.go.\n'
            exit 1
          fi
          oldest=$(printf '%s\n%s\n' "$tag_core" "$cli_version" | sort -V | head -n 1)
          if [ "$oldest" != "$cli_version" ]; then
            printf '::error::Release tag %s is older than the generated CLI version %s. Tag %s or newer.\n' "$GITHUB_REF_NAME" "$cli_version" "v$cli_version"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-artifacts
          path: |
            dist/
            !dist/*.txt
          retention-days: 30
