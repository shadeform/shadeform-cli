openapi: "3.1.0"
components:
  schemas:
    AddSshKeyRequest:
      description: "AddSshKeyRequest schema"
      properties:
        name:
          description: "A name for the key."
          example: "My laptop key"
          type: "string"
        private_key:
          description: "Optional. The matching private key in OpenSSH PEM format, stored encrypted so Shadeform can connect to instances on your behalf. Leave empty to keep the private key on your machine."
          type: "string"
        public_key:
          description: "The OpenSSH public key, as found in the .pub file."
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGx... user@laptop"
          type: "string"
      required:
        - "name"
        - "public_key"
      type: "object"
    AddSshKeyResponse:
      description: "AddSshKeyResponse schema"
      properties:
        id:
          description: "The ID of the new SSH key."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
      required:
        - "id"
      type: "object"
    Alert:
      description: "Send an email alert when a date or a spend threshold is reached."
      properties:
        date_threshold:
          description: "Send an email alert at this time. RFC 3339 timestamp."
          example: "2026-12-31T23:59:00Z"
          nullable: true
          type: "string"
        spend_threshold:
          description: "Send an email alert once the instance's spend reaches this amount. Decimal dollar amount as a string."
          example: "10.00"
          nullable: true
          type: "string"
      type: "object"
    AlertUpdate:
      description: "Replace the alert thresholds. Set a threshold to null to clear it; omit the object to keep both unchanged."
      properties:
        date_threshold:
          description: "Send an email alert at this time. RFC 3339 timestamp; null clears it."
          example: "2026-12-31T23:59:00Z"
          nullable: true
          type: "string"
        spend_threshold:
          description: "Send an email alert once the instance's spend reaches this amount. Decimal dollar amount as a string; null clears it."
          example: "10.00"
          nullable: true
          type: "string"
      type: "object"
    AutoDelete:
      description: "Delete the instance automatically when a date or a spend threshold is reached."
      properties:
        date_threshold:
          description: "Delete the instance at this time. RFC 3339 timestamp."
          example: "2026-12-31T23:59:00Z"
          nullable: true
          type: "string"
        spend_threshold:
          description: "Delete the instance once its spend reaches this amount. Decimal dollar amount as a string."
          example: "25.00"
          nullable: true
          type: "string"
      type: "object"
    AutoDeleteUpdate:
      description: "Replace the auto-delete thresholds. Set a threshold to null to clear it; omit the object to keep both unchanged."
      properties:
        date_threshold:
          description: "Delete the instance at this time. RFC 3339 timestamp; null clears it."
          example: "2026-12-31T23:59:00Z"
          nullable: true
          type: "string"
        spend_threshold:
          description: "Delete the instance once its spend reaches this amount. Decimal dollar amount as a string; null clears it."
          example: "25.00"
          nullable: true
          type: "string"
      type: "object"
    BootTime:
      description: "The expected time from create to active."
      properties:
        max_boot_in_sec:
          type: "integer"
        min_boot_in_sec:
          type: "integer"
      required:
        - "max_boot_in_sec"
        - "min_boot_in_sec"
      type: "object"
    CreateInstanceRequest:
      description: "CreateInstanceRequest schema"
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        auto_delete:
          $ref: "#/components/schemas/AutoDelete"
        cloud:
          description: "The underlying cloud provider, as listed by GET /v1/instances/types. See https://docs.shadeform.ai/getting-started/concepts#cloud-cloud-provider."
          example: "hyperstack"
          type: "string"
        enable_metrics:
          description: "Enable GPU and system metrics collection on the instance where the instance type supports it."
          example: true
          nullable: true
          type: "boolean"
        envs:
          description: "Environment variables to set on the instance for every shell session. Up to 20."
          items:
            $ref: "#/components/schemas/EnvVar"
          nullable: true
          type: "array"
        launch_configuration:
          $ref: "#/components/schemas/LaunchConfiguration"
        name:
          description: "The name of the instance. Alphanumeric characters, underscores and dashes, up to 50 characters."
          example: "cool-gpu-server"
          type: "string"
        networking:
          $ref: "#/components/schemas/Networking"
        os:
          description: "The operating system image, from the os_options of the instance type. Defaults to the instance type's default image."
          example: "ubuntu22.04_cuda12.2_shade_os"
          type: "string"
        region:
          description: "The region of the cloud provider, as listed in the availability entries of GET /v1/instances/types."
          example: "canada-1"
          type: "string"
        rental_type:
          description: "How the instance is rented: on_demand (default) or spot. Spot instances run at the discounted spot hourly price but are interruptible: Shadeform may reclaim the capacity at any time, at which point the instance is terminated with status_details set to preempted. See https://docs.shadeform.ai/guides/spotinstances."
          example: "on_demand"
          type: "string"
        shade_cloud:
          description: "True launches the instance in Shade Cloud, billed through Shadeform; false launches it in your linked cloud account. Required for AWS and Azure, where only linked accounts are supported. See https://docs.shadeform.ai/getting-started/concepts#shade-cloud."
          example: true
          nullable: true
          type: "boolean"
        shade_instance_type:
          description: "The Shadeform standardized instance type, as listed by GET /v1/instances/types. See https://docs.shadeform.ai/getting-started/concepts#shade-instance-type-and-cloud-instance-type."
          example: "A6000"
          type: "string"
        ssh_key_id:
          description: "The ID of the SSH key to install, from GET /v1/sshkeys. Defaults to the account's default key."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
        tags:
          description: "Custom, searchable tags. Up to 200 characters each."
          items:
            description: "Custom, searchable tags. Up to 200 characters each."
            type: "string"
          nullable: true
          type: "array"
        template_id:
          description: "The ID of a template whose launch configuration, auto-delete, alert, volume mount, tags, environment variables and networking are applied to the instance. Fields set directly on this request take precedence."
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
          nullable: true
          type: "string"
        volume_ids:
          description: "IDs of storage volumes to attach at launch. Currently at most one volume."
          items:
            description: "IDs of storage volumes to attach at launch. Currently at most one volume."
            type: "string"
          type:
            - "array"
            - "null"
        volume_mount:
          $ref: "#/components/schemas/VolumeMount"
      required:
        - "cloud"
        - "name"
        - "region"
        - "shade_instance_type"
      type: "object"
    CreateInstanceResponse:
      description: "CreateInstanceResponse schema"
      properties:
        id:
          type: "string"
      required:
        - "id"
      type: "object"
    CreateVolumeRequest:
      description: "CreateVolumeRequest schema"
      properties:
        cloud:
          description: "The cloud provider to create the volume in, as listed by GET /v1/volumes/types. See https://docs.shadeform.ai/getting-started/concepts#cloud-cloud-provider."
          example: "hyperstack"
          type: "string"
        name:
          description: "A name for the volume."
          example: "training-data"
          type: "string"
        region:
          description: "The region to create the volume in, as listed by GET /v1/volumes/types. A volume can only be attached to instances in the same cloud and region."
          example: "canada-1"
          type: "string"
        size_in_gb:
          description: "The size of the volume in GB."
          example: 100
          type: "integer"
      required:
        - "cloud"
        - "name"
        - "region"
        - "size_in_gb"
      type: "object"
    CreateVolumeResponse:
      description: "CreateVolumeResponse schema"
      properties:
        id:
          description: "The ID of the new volume."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
      required:
        - "id"
      type: "object"
    DefaultErrorResponse:
      description: "DefaultErrorResponse schema"
      properties:
        error:
          type: "string"
        error_code:
          type: "string"
      required:
        - "error"
        - "error_code"
      type: "object"
    DeleteSshKeyResponse:
      description: "DeleteSshKeyResponse schema"
    DockerConfiguration:
      description: "The container to pull and run at startup. Only read when type is docker. See https://docs.shadeform.ai/guides/dockercontainers."
      properties:
        args:
          description: "Arguments passed to the container at runtime, as one string."
          example: "--model mistralai/Mistral-7B-v0.1"
          type: "string"
        envs:
          description: "Environment variables passed to the container, the equivalent of docker run -e."
          items:
            $ref: "#/components/schemas/Env"
          type:
            - "array"
            - "null"
        image:
          description: "The docker image to pull and run on the instance at startup."
          example: "vllm/vllm-openai:latest"
          type: "string"
        port_mappings:
          description: "Ports published from the container on the instance, the equivalent of docker run -p."
          items:
            $ref: "#/components/schemas/PortMapping"
          type:
            - "array"
            - "null"
        registry_credentials:
          $ref: "#/components/schemas/RegistryCredentials"
        shared_memory_in_gb:
          description: "Shared memory for the container in GB, the equivalent of docker run --shm-size. When omitted the container shares the host's IPC namespace and gets the host's shared memory."
          example: 8
          type: "integer"
        volume_mounts:
          description: "Bind mounts from the instance into the container, the equivalent of docker run -v."
          items:
            $ref: "#/components/schemas/DockerVolumeMount"
          type:
            - "array"
            - "null"
      type: "object"
    DockerVolumeMount:
      description: "Bind mounts from the instance into the container, the equivalent of docker run -v."
      properties:
        container_path:
          description: "The path inside the container."
          example: "/root/.cache/huggingface"
          type: "string"
        host_path:
          description: "The path on the instance."
          example: "~/.cache/huggingface"
          type: "string"
      required:
        - "container_path"
        - "host_path"
      type: "object"
    Env:
      description: "Environment variables passed to the container, the equivalent of docker run -e."
      properties:
        name:
          description: "The name of the environment variable."
          example: "HUGGING_FACE_HUB_TOKEN"
          type: "string"
        value:
          description: "The value of the environment variable."
          example: "hf_xxxxxxxxxxxxxxxx"
          type: "string"
      required:
        - "name"
        - "value"
      type: "object"
    EnvVar:
      properties:
        name:
          description: "The name of the environment variable."
          example: "WANDB_API_KEY"
          type: "string"
        value:
          description: "The value of the environment variable."
          example: "wandb_xxxxxxxx"
          type: "string"
      required:
        - "name"
        - "value"
      type: "object"
    ErrorItem:
      properties:
        more:
          additionalProperties:
            description: "Additional information about the error"
          description: "Additional information about the error"
          type:
            - "object"
            - "null"
        name:
          description: "For example, name of the parameter that caused the error"
          type: "string"
        reason:
          description: "Human readable error message"
          type: "string"
      required:
        - "name"
        - "reason"
      type: "object"
    HTTPError:
      description: "HTTPError schema"
      properties:
        detail:
          description: "Human readable error message"
          type: "string"
        errors:
          items:
            $ref: "#/components/schemas/ErrorItem"
          type:
            - "array"
            - "null"
        instance:
          type: "string"
        status:
          description: "HTTP status code"
          example: 403
          type: "integer"
        title:
          description: "Short title of the error"
          type: "string"
        type:
          description: "URL of the error type. Can be used to lookup the error in a documentation"
          type: "string"
      type: "object"
    Instance:
      properties:
        account_id:
          nullable: true
          type: "string"
        active_at:
          description: "When the instance became active, in UTC. Null until then."
          example: "2026-08-29T09:12:33.001Z"
          format: "date-time"
          nullable: true
          type: "string"
        alert:
          $ref: "#/components/schemas/Alert"
        auto_delete:
          $ref: "#/components/schemas/AutoDelete"
        boot_time:
          $ref: "#/components/schemas/BootTime"
        cloud:
          description: "The underlying cloud provider."
          example: "hyperstack"
          type: "string"
        cloud_assigned_id:
          description: "The ID the cloud provider assigned to the instance."
          example: "13b057d7-e266-4869-985f-760fe75a78b3"
          type: "string"
        cloud_instance_type:
          description: "The cloud provider's own name for the instance type."
          example: "gpu_1x_a6000"
          type: "string"
        cluster_id:
          nullable: true
          type: "string"
        commitment_id:
          nullable: true
          type: "string"
        configuration:
          $ref: "#/components/schemas/InstanceConfiguration"
        cost_estimate:
          description: "The cost incurred so far through Shadeform, as a decimal dollar string. Instances in your own cloud account are billed by that provider instead."
          example: "103.40"
          nullable: true
          type: "string"
        created_at:
          description: "When the instance was created, in UTC."
          example: "2026-08-29T09:10:01.000Z"
          format: "date-time"
          type: "string"
        deleted_at:
          description: "When the instance was deleted, in UTC. Null while it exists."
          example: "2026-08-30T09:12:33.001Z"
          format: "date-time"
          nullable: true
          type: "string"
        details:
          $ref: "#/components/schemas/InstanceDetails"
        email:
          nullable: true
          type: "string"
        envs:
          items:
            $ref: "#/components/schemas/EnvVar"
          nullable: true
          type: "array"
        flex_vm:
          description: "True when Shadeform virtualizes this instance. The cloud field stays the hardware owner."
          example: true
          type: "boolean"
        hourly_price:
          description: "The on-demand hourly price in cents."
          example: 210
          type: "integer"
        id:
          description: "The ID of the instance, used in the /v1/instances/{instance_id}/... routes."
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
          type: "string"
        internal_hostname:
          nullable: true
          type: "string"
        ip:
          description: "The public IP address of the instance, or in some clouds its DNS name. Null until the instance is active."
          example: "1.0.0.1"
          nullable: true
          type: "string"
        launch_configuration:
          $ref: "#/components/schemas/LaunchConfiguration"
        model_name:
          type: "string"
        name:
          description: "The name of the instance."
          example: "cool-gpu-server"
          type: "string"
        port_forwards:
          items:
            $ref: "#/components/schemas/PortForward"
          nullable: true
          type: "array"
        private_ip:
          nullable: true
          type: "string"
        region:
          description: "The region of the cloud provider."
          example: "canada-1"
          type: "string"
        rental_terms:
          $ref: "#/components/schemas/RentalTerms"
        running_time_seconds:
          nullable: true
          type: "integer"
        shade_cloud:
          description: "True when the instance runs in Shade Cloud, false when it runs in your linked cloud account."
          example: true
          type: "boolean"
        shade_instance_type:
          description: "The Shadeform standardized instance type."
          example: "A6000"
          type: "string"
        ssh_key_id:
          description: "The ID of the SSH key installed on the instance."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
        ssh_port:
          description: "The SSH port. Usually 22; some clouds use another port."
          example: 22
          nullable: true
          type: "integer"
        ssh_user:
          description: "The user to SSH in as."
          example: "shadeform"
          nullable: true
          type: "string"
        status:
          description: "The lifecycle status: pending, active, deleting, deleted or an error state."
          example: "active"
          type: "string"
        status_details:
          description: "More detail on the status. A spot instance Shadeform reclaimed carries preempted once terminated."
          example: "downloading"
          type: "string"
        tags:
          items:
            type: "string"
          nullable: true
          type: "array"
        template_id:
          nullable: true
          type: "string"
        total_spend:
          nullable: true
          type: "string"
        volume_ids:
          description: "IDs of the storage volumes attached to the instance."
          items:
            description: "IDs of the storage volumes attached to the instance."
            type: "string"
          type:
            - "array"
            - "null"
      required:
        - "active_at"
        - "boot_time"
        - "cloud"
        - "cloud_assigned_id"
        - "cloud_instance_type"
        - "configuration"
        - "cost_estimate"
        - "created_at"
        - "deleted_at"
        - "flex_vm"
        - "hourly_price"
        - "id"
        - "ip"
        - "name"
        - "region"
        - "rental_terms"
        - "shade_cloud"
        - "shade_instance_type"
        - "ssh_key_id"
        - "ssh_port"
        - "ssh_user"
        - "status"
        - "status_details"
      type: "object"
    InstanceConfiguration:
      description: "The hardware of the instance type."
      properties:
        gpu_manufacturer:
          type: "string"
        gpu_type:
          type: "string"
        interconnect:
          type: "string"
        memory_in_gb:
          type: "integer"
        num_gpus:
          type: "integer"
        nvlink:
          type: "boolean"
        os:
          type: "string"
        os_options:
          items:
            type: "string"
          type:
            - "array"
            - "null"
        storage_in_gb:
          type: "integer"
        vcpus:
          type: "integer"
        vram_per_gpu_in_gb:
          type: "integer"
      required:
        - "gpu_manufacturer"
        - "gpu_type"
        - "interconnect"
        - "memory_in_gb"
        - "num_gpus"
        - "nvlink"
        - "storage_in_gb"
        - "vcpus"
        - "vram_per_gpu_in_gb"
      type: "object"
    InstanceDetails:
      properties:
        auth_password:
          type: "string"
        auth_user:
          type: "string"
        external_name:
          type: "string"
        http_port:
          type: "integer"
      type: "object"
    InstanceType:
      properties:
        availability:
          description: "Where the instance type can be launched right now, one entry per region and rental type."
          items:
            $ref: "#/components/schemas/InstanceTypeAvailability"
          type:
            - "array"
            - "null"
        boot_time:
          $ref: "#/components/schemas/BootTime"
        cloud:
          description: "The underlying cloud provider; use it as cloud when creating an instance."
          example: "hyperstack"
          type: "string"
        cloud_instance_type:
          description: "The cloud provider's own name for the instance type."
          example: "gpu_1x_a6000"
          type: "string"
        configuration:
          $ref: "#/components/schemas/InstanceConfiguration"
        deployment_type:
          description: "What is provisioned: vm (virtual machine), container (docker container) or baremetal (bare metal server)."
          example: "vm"
          type: "string"
        flex_vm:
          description: "True when the instance is a Flex VM: Shadeform virtualizes the GPU server, which may be owned by a compute provider (see cloud). Flex VMs enable additional features such as metrics and a KVM console, with more coming soon. [Learn more about Flex VMs](https://shadeform.com/flex-vms)."
          type: "boolean"
        gpu_type:
          description: "The GPU model."
          example: "A6000"
          type: "string"
        hourly_price:
          description: "The on-demand hourly price in cents."
          example: 210
          type: "integer"
        interconnect:
          description: "The GPU interconnect, for example pcie or sxm."
          example: "pcie"
          type: "string"
        memory_in_gb:
          description: "System memory in GB."
          example: 64
          type: "integer"
        num_gpus:
          description: "Number of GPUs."
          example: 1
          type: "integer"
        nvlink:
          description: "True when the GPUs are connected with NVLink."
          example: false
          type: "boolean"
        shade_instance_type:
          description: "The Shadeform standardized instance type; use it as shade_instance_type when creating an instance."
          example: "A6000"
          type: "string"
        storage_in_gb:
          description: "Local storage in GB."
          example: 500
          type: "integer"
        vcpus:
          description: "Number of virtual CPUs."
          example: 16
          type: "integer"
      required:
        - "boot_time"
        - "cloud"
        - "cloud_instance_type"
        - "configuration"
        - "deployment_type"
        - "flex_vm"
        - "gpu_type"
        - "hourly_price"
        - "interconnect"
        - "memory_in_gb"
        - "num_gpus"
        - "nvlink"
        - "shade_instance_type"
        - "storage_in_gb"
        - "vcpus"
      type: "object"
    InstanceTypeAvailability:
      description: "Where the instance type can be launched right now, one entry per region and rental type."
      properties:
        available:
          description: "True when the instance type can be launched in this region right now."
          example: true
          type: "boolean"
        display_name:
          description: "The human-readable name of the region."
          example: "Toronto, Canada"
          type: "string"
        hourly_price:
          type: "string"
        region:
          description: "The region; use it as region when creating an instance."
          example: "canada-1"
          type: "string"
        rental_type:
          type: "string"
      required:
        - "available"
        - "display_name"
        - "region"
        - "rental_type"
      type: "object"
    InstanceTypesResponse:
      description: "InstanceTypesResponse schema"
      properties:
        instance_types:
          items:
            $ref: "#/components/schemas/InstanceType"
          type:
            - "array"
            - "null"
      required:
        - "instance_types"
      type: "object"
    InstancesResponse:
      description: "InstancesResponse schema"
      properties:
        instances:
          items:
            $ref: "#/components/schemas/Instance"
          type:
            - "array"
            - "null"
        total:
          nullable: true
          type: "integer"
      required:
        - "instances"
      type: "object"
    LaunchConfiguration:
      description: "What to run automatically once the instance is active: a docker container or a startup script. See https://docs.shadeform.ai/getting-started/concepts#launch-configuration."
      properties:
        args:
          description: "Deprecated. Use docker_configuration.args."
          example: "--model mistralai/Mistral-7B-v0.1"
          type: "string"
        base64_script:
          description: "Deprecated. Use script_configuration.base64_script."
          example: "IyEvYmluL2Jhc2gKZWNobyAiaGVsbG8iCg=="
          type: "string"
        container_status:
          description: "Read-only. The status of the launched container as last reported by the instance."
          example: "running"
          type: "string"
        docker_configuration:
          $ref: "#/components/schemas/DockerConfiguration"
        image:
          description: "Deprecated. Use docker_configuration.image."
          example: "vllm/vllm-openai:latest"
          type: "string"
        model_configuration:
          $ref: "#/components/schemas/ModelConfiguration"
        script_configuration:
          $ref: "#/components/schemas/ScriptConfiguration"
        type:
          description: "The kind of launch configuration: docker runs a container, script runs a startup script. Determines which of docker_configuration and script_configuration is read."
          example: "docker"
          type: "string"
      type: "object"
    ModelConfiguration:
      description: "The model to serve with vLLM and the API key its inference endpoint requires from callers. On a launch configuration this is the legacy vLLM launch type; prefer docker_configuration."
      properties:
        api_key:
          description: "The API key the served model's inference endpoint will require from callers. Not your Shadeform API key."
          type: "string"
          x-speakeasy-name-override: modelApiKey
        model_properties:
          $ref: "#/components/schemas/ModelProperties"
      required:
        - "api_key"
      type: "object"
    ModelProperties:
      description: "The model to load and how to serve it."
      properties:
        block_size:
          description: "The token block size for the KV cache."
          example: 16
          type: "integer"
        hugging_face_hub_token:
          description: "A Hugging Face access token, needed for gated or private models."
          type: "string"
        max_model_len:
          description: "The maximum context length in tokens. Defaults to the model's configured maximum."
          example: 4096
          type: "integer"
        max_num_batched_tokens:
          description: "The maximum number of tokens processed per iteration."
          example: 8192
          type: "integer"
        max_num_seq:
          description: "The maximum number of sequences processed per iteration."
          example: 256
          type: "integer"
        max_paddings:
          description: "The maximum number of padding tokens per batch."
          example: 256
          type: "integer"
        model:
          description: "The Hugging Face model ID to serve."
          example: "mistralai/Mistral-7B-v0.1"
          type: "string"
        num_gpus:
          description: "The number of GPUs to shard the model across. Defaults to all GPUs on the instance."
          example: 1
          type: "integer"
        quantization:
          description: "The weight quantization method, for example awq or gptq. Defaults to none."
          example: "awq"
          type: "string"
        revision:
          description: "The model revision: a branch, tag or commit."
          example: "main"
          type: "string"
        tokenizer:
          description: "The Hugging Face tokenizer ID. Defaults to the model's own tokenizer."
          example: "mistralai/Mistral-7B-v0.1"
          type: "string"
      required:
        - "model"
      type: "object"
    Networking:
      description: "Network configuration, currently UFW firewall rules applied at boot."
      properties:
        ufw_rules:
          description: "UFW (Uncomplicated Firewall) rules applied when the instance boots."
          items:
            $ref: "#/components/schemas/UfwRule"
          nullable: true
          type: "array"
      type: "object"
    PortForward:
      properties:
        external_port:
          type: "integer"
        internal_port:
          type: "integer"
      required:
        - "external_port"
        - "internal_port"
      type: "object"
    PortMapping:
      description: "Ports published from the container on the instance, the equivalent of docker run -p."
      properties:
        container_port:
          description: "The port inside the container."
          example: 8000
          type: "integer"
        host_port:
          description: "The port on the instance."
          example: 80
          type: "integer"
      required:
        - "container_port"
        - "host_port"
      type: "object"
    RegistryCredentials:
      description: "Credentials for a private docker registry, used for the pull."
      properties:
        password:
          description: "The registry password or access token."
          example: "password"
          nullable: true
          type: "string"
        username:
          description: "The registry username."
          example: "username"
          nullable: true
          type: "string"
      required:
        - "password"
        - "username"
      type: "object"
    RentalTerms:
      description: "How the instance is rented and on what terms."
      properties:
        ending_at:
          format: "date-time"
          nullable: true
          type: "string"
        hourly_price:
          type: "string"
        rental_type:
          type: "string"
      required:
        - "ending_at"
        - "rental_type"
      type: "object"
    SaveTemplateResponse:
      description: "SaveTemplateResponse schema"
      properties:
        id: {}
      required:
        - "id"
      type: "object"
    ScriptConfiguration:
      description: "The startup script to run once the instance is active. Only read when type is script. See https://docs.shadeform.ai/guides/startupscript."
      properties:
        base64_script:
          description: "The startup script, base64 encoded. Runs as root once the instance is active; up to 40000 characters encoded."
          example: "IyEvYmluL2Jhc2gKZWNobyAiaGVsbG8iCg=="
          type: "string"
      type: "object"
    SetDefaultSshKeyResponse:
      description: "SetDefaultSshKeyResponse schema"
    SshKeyResponse:
      properties:
        id:
          description: "The ID of the SSH key."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
        is_default:
          description: "True for the key installed on new instances when no ssh_key_id is given."
          example: true
          type: "boolean"
        name:
          description: "The name of the SSH key."
          example: "My laptop key"
          type: "string"
        public_key:
          description: "The OpenSSH public key."
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGx... user@laptop"
          type: "string"
      required:
        - "id"
        - "is_default"
        - "name"
        - "public_key"
      type: "object"
    SshKeysResponse:
      description: "SshKeysResponse schema"
      properties:
        ssh_keys:
          items:
            $ref: "#/components/schemas/SshKeyResponse"
          type:
            - "array"
            - "null"
      required:
        - "ssh_keys"
      type: "object"
    Template:
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        author:
          description: "Who published the template. Up to 50 characters."
          example: "Shadeform"
          nullable: true
          type: "string"
        auto_delete:
          $ref: "#/components/schemas/AutoDelete"
        description:
          description: "What the template launches and when to use it. Up to 10000 characters."
          example: "Serves mistralai/Mistral-7B-v0.1 with vLLM on port 8000."
          nullable: true
          type: "string"
        envs:
          description: "Environment variables to set on the instance for every shell session. Up to 20."
          items:
            $ref: "#/components/schemas/EnvVar"
          nullable: true
          type: "array"
        featured:
          description: "True for templates Shadeform curates and lists under GET /v1/templates/featured. Read-only."
          example: false
          nullable: true
          type: "boolean"
        id:
          description: "The ID of the template, assigned by Shadeform. Ignored on save."
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
          nullable: true
        is_account_owner:
          description: "True when the template belongs to the requesting account. Read-only."
          example: true
          nullable: true
          type: "boolean"
        launch_configuration:
          $ref: "#/components/schemas/LaunchConfiguration"
        logo:
          description: "URL of a logo shown with the template. Up to 200 characters."
          example: "https://example.com/logo.png"
          nullable: true
          type: "string"
        metadata:
          description: "Free-form labels attached to the template, such as the model or framework it runs."
          items:
            description: "Free-form labels attached to the template, such as the model or framework it runs."
            type: "string"
          nullable: true
          type: "array"
        name:
          description: "The name of the template. Alphanumeric characters, spaces, underscores and dashes, up to 100 characters."
          example: "vLLM Mistral 7B"
          type: "string"
        networking:
          $ref: "#/components/schemas/Networking"
        public:
          description: "True makes the template visible to every Shadeform account; false keeps it private to yours."
          example: false
          type: "boolean"
        tags:
          description: "Custom, searchable tags. Up to 200 characters each."
          items:
            description: "Custom, searchable tags. Up to 200 characters each."
            type: "string"
          nullable: true
          type: "array"
        volume_mount:
          $ref: "#/components/schemas/VolumeMount"
      required:
        - "name"
        - "public"
      type: "object"
    TemplatesResponse:
      description: "TemplatesResponse schema"
      properties:
        templates:
          items:
            $ref: "#/components/schemas/Template"
          type:
            - "array"
            - "null"
      required:
        - "templates"
      type: "object"
    UfwRule:
      description: "UFW (Uncomplicated Firewall) rules applied when the instance boots."
      properties:
        from_ip:
          description: "Source IP address or CIDR range the rule applies to. Defaults to any."
          example: "192.168.1.0/24"
          nullable: true
          type: "string"
        port:
          description: "Port number or range, for example 80 or 8000:8999."
          example: "8000"
          nullable: true
          type: "string"
        proto:
          description: "Protocol: tcp or udp. Defaults to both."
          example: "tcp"
          nullable: true
          type: "string"
        rule:
          description: "The UFW action: allow, deny, reject or limit."
          example: "allow"
          type: "string"
        to_ip:
          description: "Destination IP address or CIDR range the rule applies to. Defaults to any."
          example: "10.0.0.0/8"
          nullable: true
          type: "string"
      required:
        - "rule"
      type: "object"
    UpdateInstanceModelResponse:
      description: "UpdateInstanceModelResponse schema"
      properties:
        id:
          type: "string"
      required:
        - "id"
      type: "object"
    UpdateInstanceRequest:
      description: "UpdateInstanceRequest schema"
      properties:
        alert:
          $ref: "#/components/schemas/AlertUpdate"
        auto_delete:
          $ref: "#/components/schemas/AutoDeleteUpdate"
        name:
          description: "The new name of the instance. Omit to keep the current name."
          example: "cool-gpu-server"
          nullable: true
          type: "string"
        tags:
          description: "Replace the instance's tags. Pass an empty list to remove them; omit to keep them."
          items:
            description: "Replace the instance's tags. Pass an empty list to remove them; omit to keep them."
            type: "string"
          nullable: true
          type: "array"
      type: "object"
    Volume:
      properties:
        cloud:
          description: "The cloud provider the volume lives in."
          example: "hyperstack"
          type: "string"
        cloud_assigned_id:
          description: "The ID the cloud provider assigned to the volume."
          example: "13b057d7-e266-4869-985f-760fe75a78b3"
          type: "string"
        cost_estimate:
          description: "The cost incurred by the volume so far through Shadeform, as a decimal dollar string."
          example: "10.34"
          type: "string"
        fixed_size:
          description: "True when the volume has a fixed size; false when it grows with use."
          example: true
          type: "boolean"
        id:
          description: "The ID of the volume."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
        mounted_by:
          description: "IDs of the instances currently mounting the volume."
          items:
            description: "IDs of the instances currently mounting the volume."
            type: "string"
          type:
            - "array"
            - "null"
        name:
          description: "The name of the volume."
          example: "training-data"
          type: "string"
        region:
          description: "The region the volume lives in."
          example: "canada-1"
          type: "string"
        size_in_gb:
          description: "The size of the volume in GB."
          example: 100
          type: "integer"
        supports_multi_mount:
          description: "True when several instances can mount the volume at the same time."
          example: false
          type: "boolean"
      required:
        - "cloud"
        - "cloud_assigned_id"
        - "cost_estimate"
        - "fixed_size"
        - "id"
        - "mounted_by"
        - "name"
        - "region"
        - "size_in_gb"
        - "supports_multi_mount"
      type: "object"
    VolumeMount:
      description: "How attached storage volumes are mounted onto the instance's file system."
      properties:
        auto:
          description: "True mounts every attached volume that is not already mounted at a default path under /home/shadeform."
          example: true
          nullable: true
          type: "boolean"
        mapping:
          description: "Explicit mounts of attached volumes to paths on the instance. Use instead of auto when the path matters."
          items:
            $ref: "#/components/schemas/VolumeMountMap"
          type:
            - "array"
            - "null"
      type: "object"
    VolumeMountMap:
      description: "Explicit mounts of attached volumes to paths on the instance. Use instead of auto when the path matters."
      properties:
        disk:
          description: "The ID of the attached storage volume to mount."
          example: "78a0dd5a-dbb1-4568-b55c-5e7e0a8b0c40"
          type: "string"
        file_path:
          description: "The absolute path on the instance to mount the volume at."
          example: "/home/shadeform/data"
          type: "string"
      required:
        - "disk"
        - "file_path"
      type: "object"
    VolumeType:
      properties:
        cloud:
          description: "The cloud provider offering this volume type."
          example: "hyperstack"
          type: "string"
        display_name:
          description: "The human-readable name of the region."
          example: "Toronto, Canada"
          type: "string"
        fixed_size:
          description: "True when volumes of this type have a fixed size."
          example: true
          type: "boolean"
        price_per_gb_per_hour:
          description: "The price per GB per hour, as a decimal dollar string."
          example: "0.0001"
          type: "string"
        region:
          description: "The region the volume type is offered in; use it as region when creating a volume."
          example: "canada-1"
          type: "string"
        supports_multiple_mounts:
          description: "True when several instances can mount a volume of this type at once."
          example: false
          type: "boolean"
      required:
        - "cloud"
        - "display_name"
        - "fixed_size"
        - "price_per_gb_per_hour"
        - "region"
        - "supports_multiple_mounts"
      type: "object"
    VolumeTypesResponse:
      description: "VolumeTypesResponse schema"
      properties:
        volume_types:
          items:
            $ref: "#/components/schemas/VolumeType"
          type:
            - "array"
            - "null"
      required:
        - "volume_types"
      type: "object"
    VolumesResponse:
      description: "VolumesResponse schema"
      properties:
        volumes:
          items:
            $ref: "#/components/schemas/Volume"
          type:
            - "array"
            - "null"
      required:
        - "volumes"
      type: "object"
    string:
      description: "string schema"
      type: "string"
    unknown-interface:
      description: "unknown-interface schema"
  securitySchemes:
    ApiKeyAuth:
      description: "API key issued from the Shadeform dashboard (Settings → API Keys)."
      in: "header"
      name: "X-API-KEY"
      type: "apiKey"
      x-speakeasy-name-override: apiKey
info:
  description: "Shadeform is a single API and platform for deploying and managing cloud GPUs."
  title: "Shadeform API"
  version: "1.0.0"
paths:
  /v1/instances:
    get:
      description: "Get all non deleted instances. Note: instances in the \"deleting\" status will also show up here."
      operationId: "listInstances"
      parameters:
        - description: "Only instances in this status. `deleted` selects the deletion history instead of the live list."
          in: "query"
          name: "status"
          schema:
            type: "string"
        - description: "Match instances whose name, id or address contains this text."
          in: "query"
          name: "search"
          schema:
            type: "string"
        - description: "Page size. Between 1 and 100; defaults to 50 when either pagination parameter is given."
          in: "query"
          name: "limit"
          schema:
            type: "integer"
        - description: "How many instances to skip. Requires a non-negative integer."
          in: "query"
          name: "offset"
          schema:
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancesResponse"
          description: "OK"
        "400":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "A query parameter was rejected. The body is the reason - which parameter, and what it accepts. Plain text."
        "404":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "Plain-text body. Reachable only through the shared lookup; a list with no matches is an empty array and a 200."
        "500":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The request failed inside the service. Plain-text body."
      summary: "List instances"
      tags:
        - instances
      x-speakeasy-name-override: list
      x-gram:
        name: instances-list
      x-speakeasy-mcp:
        scopes:
          - read
  /v1/instances/create:
    post:
      description: "Create a new GPU instance. Our create API is designed to be asynchronous, so the response will be a CreateResponse object with a status of \"creating\". We then have a process that will pick it up and create it. You can poll the /instances/{id}/info endpoint to check the status of the instance."
      operationId: "createInstance"
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
        description: "Request body for instances.CreateInstanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInstanceResponse"
          description: "OK"
        "400":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The body could not be read, or names a cloud that does not exist. Plain-text body."
        "404":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "A template, SSH key or volume named in the request is not on this account. Plain-text body."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultErrorResponse"
          description: "The operation was refused, or the instance is not in a state that allows it. The body names the reason in `error`, with a machine-readable `error_code`. One case, restarting an instance that is not active, answers 409 with no body at all."
        "500":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The request failed inside the service. Plain-text body."
      summary: "Create an instance"
      tags:
        - instances
      x-speakeasy-name-override: create
      x-gram:
        name: instances-create
      x-speakeasy-mcp:
        scopes:
          - write
  /v1/instances/types:
    get:
      description: "Return all the GPU instance types with their corresponding availability and specs.\n\nEvery `availability` entry carries a `rental_type` (`on_demand` or `spot`). Instance types that offer spot list each region twice, once per rental type, and the two entries can differ in `available`. If your integration keys on `region` or checks whether any region is available, filter to `rental_type: on_demand` first to keep the previous behavior. See the [Spot Instances guide](/guides/spotinstances) for details."
      operationId: "listInstanceTypes"
      parameters:
        - description: "Only return instance types on this cloud (case-insensitive)."
          examples:
            example:
              value: "lambdalabs"
          in: "query"
          name: "cloud"
          schema:
            type: "string"
        - description: "Only return availability entries in this Shade region (case-insensitive). Instance types left with no matching region are dropped from the response entirely."
          examples:
            example:
              value: "us-east-1"
          in: "query"
          name: "region"
          schema:
            type: "string"
        - description: "A non-zero value returns only instance types with exactly that GPU count. 0 disables the filter, and so does omitting the parameter - the two are indistinguishable, so this filter cannot select instance types with no GPUs."
          examples:
            example:
              value: 8
          in: "query"
          name: "num_gpus"
          schema:
            type: "integer"
        - description: "Only return instance types with this GPU type (case-insensitive)."
          examples:
            example:
              value: "H100"
          in: "query"
          name: "gpu_type"
          schema:
            type: "string"
        - description: "Only return this Shade instance type (case-insensitive)."
          examples:
            example:
              value: "H100_sxm5x8"
          in: "query"
          name: "shade_instance_type"
          schema:
            type: "string"
        - description: "\"true\" keeps only available entries, \"false\" only unavailable ones. Any other value is ignored."
          examples:
            example:
              value: "true"
          in: "query"
          name: "available"
          schema:
            type: "string"
        - description: "Ordering, not filtering: \"price\" sorts ascending by on-demand hourly price, removing nothing. Any other value is ignored."
          examples:
            example:
              value: "price"
          in: "query"
          name: "sort"
          schema:
            type: "string"
        - description: "\"true\" excludes the hyperscalers (AWS, Azure). Any other value is ignored."
          examples:
            example:
              value: "true"
          in: "query"
          name: "shade_cloud"
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceTypesResponse"
          description: "OK"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HTTPError"
          description: "The request was rejected before the handler ran: a query or path parameter that could not be bound."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HTTPError"
          description: "The request failed inside the service. `detail` is omitted: the underlying error is logged, never returned."
      security: []
      summary: "List instance types"
      tags:
        - instances
      x-speakeasy-name-override: listTypes
      x-gram:
        name: instances-list-types
      x-speakeasy-mcp:
        scopes:
          - read
  /v1/instances/{instance_id}/delete:
    post:
      description: "This will move the instance to the 'deleting' status while the instance is being deleted. Once the instance has entered the 'deleting' status, the account will no longer be billed for the instance."
      operationId: "deleteInstance"
      parameters:
        - description: "The ID of the instance, from the id field of GET /v1/instances or the create response."
          in: "path"
          name: "instance_id"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "The deletion was accepted."
        "400":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The instance id in the path is not a valid UUID. Plain-text body."
        "404":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "No such instance on this account. Plain-text body."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultErrorResponse"
          description: "The operation was refused, or the instance is not in a state that allows it. The body names the reason in `error`, with a machine-readable `error_code`. One case, restarting an instance that is not active, answers 409 with no body at all."
        "500":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The request failed inside the service. Plain-text body."
      summary: "Delete an instance"
      tags:
        - instances
      x-speakeasy-name-override: delete
      x-gram:
        name: instances-delete
        description: >-
          Delete an instance. This will move the instance to the 'deleting' status while the instance is being deleted. Once the instance has entered the 'deleting' status, the account will no longer be billed for the instance. This action is irreversible and destroys any data on the instance's local disk. Before calling this tool, restate the instance name and id to the user and wait for their explicit confirmation. Never delete an instance the user did not name.
      x-speakeasy-mcp:
        scopes:
          - write
  /v1/instances/{instance_id}/info:
    get:
      description: "Get details for the specified, non deleted, instance in the url."
      operationId: "getInstance"
      parameters:
        - description: "The ID of the instance, from the id field of GET /v1/instances or the create response."
          in: "path"
          name: "instance_id"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: "OK"
        "400":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The instance id in the path is not a valid UUID. Plain-text body."
        "404":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "No such instance on this account. Plain-text body."
        "500":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/string"
          description: "The request failed inside the service. Plain-text body."
      summary: "Get an instance"
      tags:
        - instances
      x-speakeasy-name-override: get
      x-gram:
        name: instances-get
      x-speakeasy-mcp:
        scopes:
          - read
  /v1/instances/{instance_id}/restart:
    post:
      description: "Restart an instance. The status of the instance will stay as 'active' throughout, but you may have to wait a few minutes for the instance to be ready to use again."
      operationId: "restartInstance"
      parameters:
        - description: "The ID of the instance, from the id field of GET /v1/instances or the create response."
          in: "path"
          name: "instance_id"
          required: true
          schema:
            type: "string"
      responses:
